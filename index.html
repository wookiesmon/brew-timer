<meta charset="utf-8">
<title>Drip Coffee Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='88'>☕</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#A64B24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brew Timer">
<style>
  :root {
    --display: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --bg: #EBDFC9;
    --surface: #F7EFDE;
    --ink: #241A12;
    --muted: #6B5B47;
    --line: rgba(36, 26, 18, 0.16);
    --track: rgba(36, 26, 18, 0.10);
    --hot: #A64B24;
    --iced: #3E7A8C;
    --accent: var(--hot);
    --accent-ink: #FFF6E9;
    --done: #4C7F49;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #332619;
      --surface: #423220;
      --ink: #F2E9DB;
      --muted: #C4B199;
      --line: rgba(242, 233, 219, 0.17);
      --track: rgba(242, 233, 219, 0.11);
      --hot: #E08A4F;
      --iced: #84B9CC;
      --accent-ink: #2A1D10;
      --done: #8FC79B;
    }
  }
  :root[data-theme="light"] {
    --bg: #EBDFC9;
    --surface: #F7EFDE;
    --ink: #241A12;
    --muted: #6B5B47;
    --line: rgba(36, 26, 18, 0.16);
    --track: rgba(36, 26, 18, 0.10);
    --hot: #A64B24;
    --iced: #3E7A8C;
    --accent-ink: #FFF6E9;
    --done: #4C7F49;
  }
  :root[data-theme="dark"] {
    --bg: #332619;
    --surface: #423220;
    --ink: #F2E9DB;
    --muted: #C4B199;
    --line: rgba(242, 233, 219, 0.17);
    --track: rgba(242, 233, 219, 0.11);
    --hot: #E08A4F;
    --iced: #84B9CC;
    --accent-ink: #2A1D10;
    --done: #8FC79B;
  }
  :root.iced { --accent: var(--iced); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    max-width: 420px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 18px 6px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    min-height: 100dvh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-bottom: 11px;
    border-bottom: 1px solid var(--line);
  }
  h1 {
    font-family: var(--display);
    white-space: nowrap;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
    flex: 1;
  }
  h1 small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }

  .langbtn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 700 11.5px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    min-height: 44px;
    padding: 0 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--track);
    border-radius: 999px;
    padding: 3px;
    min-width: 124px;
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 13px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.08em;
    min-height: 40px;
    padding: 0;
    border-radius: 999px;
    cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }

  .chiprow {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin: 0 -18px;
    padding: 2px 18px 4px;
    scrollbar-width: none;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 600 17px/1.4 var(--display);
    padding: 0 16px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.scan { border-style: dashed; }
  .chiprow.methods { margin-top: -6px; }
  .chiprow.methods .chip { font-size: 16px; padding: 0 14px; }
  /* Beans & Methods live on their own tabs now — show every option in a
     wrapped grid instead of a horizontal scroller. */
  #beans, #methods {
    flex-wrap: wrap;
    overflow-x: visible;
    margin-left: 0;
    margin-right: 0;
    padding-left: 0;
    padding-right: 0;
  }
  .pagetitle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -2px 0 -4px 0;
  }
  .pagetitle {
    font: 700 25px/1.2 var(--display);
    letter-spacing: -0.01em;
    margin-left: 2px;
  }
  .app.brewing .pagetitle-row { display: none; }
  .app[data-tab="guide"] #cupsSeg, .app[data-tab="history"] #cupsSeg { display: none; }
  .rowlabel {
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin: -4px 0 -8px 2px;
  }
  .rowhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 -8px 0;
  }
  .rowhead .rowlabel { margin: 0 0 0 2px; }
  .mini-seg {
    display: grid;
    grid-auto-flow: column;
    background: var(--track);
    border-radius: 999px;
    padding: 2px;
  }
  .mini-seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 12px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    min-height: 40px;
    padding: 0 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .mini-seg button.on { background: var(--accent); color: var(--accent-ink); }

  .histlist { display: flex; flex-direction: column; gap: 8px; }
  .histlist[hidden] { display: none; }
  .app.brewing .histlist { display: none; }
  .histrow {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 60px;
    cursor: pointer;
    color: var(--ink);
  }
  .histrow:active { transform: scale(0.99); }
  .histrow .hr-icon { font-size: 20px; flex: 0 0 auto; }
  .histrow .hr-main { flex: 1 1 auto; min-width: 0; }
  .histrow .hr-bean {
    display: block;
    font: 600 17px/1.35 var(--display);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .histrow .hr-sub {
    display: block;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .histrow .hr-when {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    white-space: nowrap;
  }
  .histrow .hr-go { flex: 0 0 auto; color: var(--accent); font-size: 17px; }

  .beaninfo {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: -4px;
    line-height: 1.45;
  }
  .beaninfo b { color: var(--ink); font-weight: 600; }
  .inforow {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 40px;
    cursor: pointer;
  }
  .chevlite { color: var(--accent); }
  .infoext { margin-top: 2px; padding-bottom: 4px; }

  .custom-cfg { display: flex; flex-direction: column; gap: 8px; margin-top: -2px; }
  .custom-cfg[hidden] { display: none; }
  .cfg-row { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 10px; }
  .cfg-row > span {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .cfg-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--track); border-radius: 999px; padding: 3px; }
  .cfg-seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 12.5px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    min-height: 40px;
    padding: 0;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cfg-seg button.on { background: var(--accent); color: var(--accent-ink); }

  .method {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .method-head {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    font: 700 15px/1.3 var(--display);
    cursor: pointer;
    text-align: left;
  }
  .method-head .sum { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .method-head .chev { color: var(--accent); flex: 0 0 auto; transition: transform 0.2s; }
  .method.open .chev { transform: rotate(180deg); }
  .method-body { display: none; padding: 0 14px 13px; }
  .method.open .method-body { display: block; }
  .method dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 14px;
    margin: 0 0 10px;
    font-size: 13px;
  }
  .method dt {
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    padding-top: 3px;
  }
  .method dd { margin: 0; font-variant-numeric: tabular-nums; }
  .method .why {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 10px;
    line-height: 1.45;
  }

  .recipe {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 6px 8px;
    text-align: center;
  }
  .stat b {
    display: block;
    font: 700 17px/1.2 var(--display);
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    display: block;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .ringwrap { position: relative; margin: 2px auto 0; width: min(72vw, 280px); }
  .ringwrap svg { display: block; width: 100%; height: auto; transform: rotate(-90deg); }
  .ring-track { stroke: var(--track); }
  .ring-fill {
    stroke: var(--accent);
    transition: stroke 0.3s;
    stroke-linecap: round;
  }
  .ring-tick { stroke: var(--bg); }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2px;
    padding: 0 30px;
  }
  .phase-label {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .clock {
    font-family: var(--display);
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .subclock {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .target {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 13px 16px;
    text-align: center;
  }
  .target .big {
    font-family: var(--display);
    font-size: 23px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .target .big em { font-style: normal; color: var(--accent); }
  .target .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14px;
    opacity: 0.62;
    transition: opacity 0.25s, border-color 0.25s;
  }
  .step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
  .step .name { font: 600 15px/1.3 var(--display); }
  .step .name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .step .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .step.active { opacity: 1; border-color: var(--accent); }
  .step.active .dot { background: var(--accent); }
  .step.done { opacity: 0.62; }
  .step.done .dot { background: var(--done); }

  .controls {
    display: grid;
    grid-template-columns: 1fr 96px;
    gap: 10px;
    margin-top: auto;
    position: sticky;
    bottom: 0;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 78%, transparent);
  }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 14px;
    font: 700 19px/1 var(--display);
    letter-spacing: 0.04em;
    padding: 18px 0;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 14px; }

  .onboard {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 13px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .onboard[hidden] { display: none; }
  .onboard ol {
    margin: 0;
    padding: 0 0 0 2px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    line-height: 1.45;
  }
  .onboard li { display: flex; gap: 9px; align-items: baseline; }
  .onboard li b {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transform: translateY(3px);
  }
  .onboard button {
    appearance: none;
    align-self: flex-end;
    border: 0;
    background: var(--track);
    color: var(--ink);
    font: 600 13px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .dialin-row { display: flex; gap: 7px; margin-top: 11px; }
  .dialin-row button {
    appearance: none;
    flex: 1;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 600 12.5px/1.3 ui-rounded, -apple-system, system-ui, sans-serif;
    min-height: 56px;
    padding: 10px 4px;
    border-radius: 12px;
    cursor: pointer;
  }
  .dialin-row button:active { transform: scale(0.97); }
  .dialin-row button b { display: block; font-size: 18px; margin-bottom: 3px; }
  .dialin-note {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.45;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 9px;
  }
  .dialin-note em { font-style: normal; color: var(--accent); font-weight: 600; }
  #dialin:empty { display: none; }

  /* Focus mode: while brewing, hide everything that isn't the brew */
  .app.brewing .rowlabel,
  .app.brewing .rowhead,
  .app.brewing #scanNote,
  .app.brewing .chiprow,
  .app.brewing .beaninfo,
  .app.brewing .custom-cfg,
  .app.brewing .method,
  .app.brewing .recipe { display: none; }
  .app.brewing .ringwrap { width: min(84vw, 320px); margin-top: 8px; }
  .app.brewing .clock { font-size: 62px; }

  /* ---- iOS-style bottom tab bar ---- */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 5px 8px calc(5px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .tabbar button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 13px/1.2 ui-rounded, -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 0 5px;
    min-height: 50px;
    border-radius: 12px;
    cursor: pointer;
  }
  .tabbar button .ico { font-size: 21px; line-height: 1; }
  .tabbar button .lbl { font-size: 13px; font-weight: 700; }
  .tabbar button.on {
    color: var(--accent);
    background: var(--track);
  }
  .tabbar button.on .lbl { font-weight: 800; }
  .tabbar button.on .ico { transform: scale(1.12); }
  .app.brewing .tabbar { display: none; }

  /* Tab visibility matrix */
  .app[data-tab="brew"] .sec-beans, .app[data-tab="brew"] .sec-methods, .app[data-tab="brew"] .sec-history, .app[data-tab="brew"] .sec-guide,
  .app[data-tab="beans"] .sec-brew, .app[data-tab="beans"] .sec-methods, .app[data-tab="beans"] .sec-history, .app[data-tab="beans"] .sec-guide,
  .app[data-tab="methods"] .sec-brew, .app[data-tab="methods"] .sec-beans, .app[data-tab="methods"] .sec-history, .app[data-tab="methods"] .sec-guide,
  .app[data-tab="history"] .sec-brew, .app[data-tab="history"] .sec-beans, .app[data-tab="history"] .sec-methods, .app[data-tab="history"] .sec-guide,
  .app[data-tab="guide"] .sec-brew, .app[data-tab="guide"] .sec-beans, .app[data-tab="guide"] .sec-methods, .app[data-tab="guide"] .sec-history { display: none !important; }

  .gcard {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 15px;
  }
  .gcard h3 {
    margin: 0 0 8px;
    font: 700 16px/1.3 var(--display);
  }
  .gcard p, .gcard li { font-size: 13px; line-height: 1.55; color: var(--muted); margin: 0; }
  .gcard b { color: var(--ink); }
  .gcard ol, .gcard ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 7px; }
  .gflow {
    text-align: center;
    font: 700 16px/1.4 var(--display);
    color: var(--accent);
  }
  /* Bean card styled like a modern roaster label (Onyx / Blue Bottle school):
     eyebrow → name → tasting-note headline → hairline spec table → CTA */
  .bc-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bc-name {
    font: 700 22px/1.2 var(--display);
    letter-spacing: -0.01em;
    margin: 3px 0 8px;
  }
  .bc-hero {
    font: 600 17px/1.45 var(--display);
    color: var(--ink);
  }
  .bc-hero .sep { color: var(--accent); font-weight: 400; padding: 0 2px; }
  .bc-table { margin: 13px 0 11px; border-top: 1px solid var(--line); }
  .bc-trow {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 7.5px 0;
    border-bottom: 1px solid var(--line);
  }
  .bc-trow .k {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .bc-trow .v {
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .bc-dots { letter-spacing: 2px; }
  .bc-dots .on { color: var(--accent); }
  .bc-dots .off { opacity: 0.22; }
  .bc-why { font-size: 12.5px !important; }
  .bc-method {
    appearance: none;
    width: 100%;

        { name: ["Main Pour", "메인 푸어"], from: 45, to: cfg.pourT, g0: cfg.bloomG, g1: cfg.water, hint: ["One continuous medium-height pour", "중간 높이의 하나의 연속 푸어"] },
        { name: ["Spin + Drawdown", "스핀 + 드로우다운"], from: cfg.pourT, to: cfg.total, g0: cfg.water, g1: cfg.water, drain: true, hint: ["Gentle Rao spin, then hands off — flat bed at the end", "부드러운 라오 스핀 후 손 떼기 — 마지막엔 평평한 베드"] },
      ],
      agitation, why,
    };
  }

  const BUILDERS = { tuned: buildTuned, kasuya46: buildKasuya, hoffmann: buildHoffmann, jeomdrip: buildJeomdrip, momos: buildMomos, osmotic: buildOsmotic, kalita: buildKalita, chadwang: buildChadWang, rao: buildRao };

  // ---- Method recommendation from the bean's profile ----
  function recommendFor(b, roastOv, procOv) {
    const proc = procOv || (b.id === "coan" ? "anaerobic" : b.id === "custom" ? customAttrs.process : null);
    const roast = roastOv || b.roast;
    const M = (best, alts, reason) => ({ best, alts, reason });
    if (b.id === "gesha") return M("osmotic", ["hoffmann", "chadwang"],
      ["delicate florals want zero agitation", "섬세한 플로럴은 교반 없이 지켜야 합니다"]);
    if (proc === "anaerobic") return M("tuned", ["kasuya46", "kalita"],
      ["ferment notes stay sweet with a cool, gentle profile", "발효 노트는 낮은 온도의 부드러운 프로파일에서 달게 유지됩니다"]);
    if (b.id === "house") return M("tuned", ["kasuya46", "hoffmann"],
      ["your baseline recipe, as-is", "기본 레시피 그대로"]);
    if (roast === "dark") return M("kalita", ["jeomdrip", "tuned"],
      ["the flat bed rounds out dark roasts without bitterness", "평평한 베드가 다크 로스트를 쓴맛 없이 둥글립니다"]);
    if (b.id === "blend") return M("kalita", ["tuned", "kasuya46"],
      ["flat-bed evenness suits balance-roasted blends", "평바닥의 고른 추출이 밸런스형 블렌드에 잘 맞습니다"]);
    if (roast === "light") return M("hoffmann", ["rao", "chadwang"],
      ["dense light roasts want full, even extraction", "밀도 높은 라이트는 충분하고 고른 추출이 필요합니다"]);
    return M("kasuya46", ["tuned", "momos"],
      ["sweet and forgiving — ideal for balanced mediums", "달콤하고 관대함 — 밸런스형 미디엄에 이상적입니다"]);
  }
  function methodName(id) { return tx(METHODS.find(x => x.id === id).chip); }

  // ---- Brew history: saved setups so you never re-scan the same bean ----
  function histLoad() {
    try { return JSON.parse(localStorage.getItem("brew.history") || "[]"); } catch (e) { return []; }
  }
  function histEntryKey(e) {
    return `${e.beanId}|${e.methodId}|${e.mode}|${e.cups}|${e.beanId === "custom" && e.custom ? e.custom.roast + e.custom.process : ""}`;
  }
  function histSave() {
    const e = { beanId, methodId, mode, cups, custom: beanId === "custom" ? { ...customAttrs } : null, t: Date.now() };
    let h = histLoad().filter(x => histEntryKey(x) !== histEntryKey(e));
    h.unshift(e);
    h = h.slice(0, 6);
    try { localStorage.setItem("brew.history", JSON.stringify(h)); } catch (err) {}
    buildHistory();
  }
  function histBeanLabel(e) {
    if (e.beanId === "custom" && e.custom) {
      return `⚙ ${tx(ROAST_LABEL[e.custom.roast] || ["?", "?"])}·${tx(PROC_LABEL[e.custom.process] || ["?", "?"])}`;
    }
    const b = PRESETS.find(x => x.id === e.beanId);
    return b ? tx(b.chip) : e.beanId;
  }
  function histWhen(t) {
    const ko = lang === "ko";
    if (!t) return "";
    const mins = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (mins < 1) return ko ? "방금" : "just now";
    if (mins < 60) return ko ? `${mins}분 전` : `${mins} min`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return ko ? `${hrs}시간 전` : `${hrs} hr`;
    const days = Math.round(hrs / 24);
    return ko ? `${days}일 전` : `${days} ${days === 1 ? "day" : "days"}`;
  }

  function buildHistory() {
    const h = histLoad();
    $("history").hidden = h.length === 0;
    $("histEmpty").hidden = h.length > 0;
    $("histEmpty").textContent = ui("histEmpty");
    $("lblRecent").textContent = ui("lblRecent");
    $("history").innerHTML = h.map((e, i) => {
      const m = METHODS.find(x => x.id === e.methodId);
      if (!m || (e.beanId !== "custom" && !PRESETS.some(x => x.id === e.beanId))) return "";
      const modeTxt = e.mode === "iced" ? (lang === "ko" ? "아이스" : "Iced") : (lang === "ko" ? "핫" : "Hot");
      const cupsTxt = e.cups === 2 ? (lang === "ko" ? "2잔" : "2 cups") : (lang === "ko" ? "1잔" : "1 cup");
      return `<button class="histrow" data-hist="${i}">
        <span class="hr-icon">${e.mode === "iced" ? "🧊" : "🔥"}</span>
        <span class="hr-main">
          <span class="hr-bean">${histBeanLabel(e)}</span>
          <span class="hr-sub">${tx(m.chip)} · ${modeTxt} · ${cupsTxt}</span>
        </span>
        <span class="hr-when">${histWhen(e.t)}</span>
        <span class="hr-go">›</span>
      </button>`;
    }).join("");
    document.querySelectorAll("#history .histrow").forEach(el =>
      el.addEventListener("click", () => applyHistory(histLoad()[Number(el.dataset.hist)])));
  }
  function applyHistory(e) {
    if (!e) return;
    beanId = e.beanId;
    methodId = e.methodId;
    mode = e.mode === "iced" ? "iced" : "hot";
    cups = e.cups === 2 ? 2 : 1;
    if (e.custom) customAttrs = { ...e.custom };

    $("btnIced").classList.toggle("on", mode === "iced");
    $("btnHot").setAttribute("aria-selected", mode === "hot");
    $("btnIced").setAttribute("aria-selected", mode === "iced");
    scanNote("");
    refresh(true);
    switchTab("brew");
    histSave(); // bump to front
  }

  let mode = "hot";
  let beanId = "house";
  let methodId = "tuned";
  let cups = 1;
  let customAttrs = { roast: "light", process: "washed" };
  try {
    mode = localStorage.getItem("brew.mode") || "hot";
    beanId = localStorage.getItem("brew.bean") || "house";
    methodId = localStorage.getItem("brew.method") || "tuned";
    cups = localStorage.getItem("brew.cups") === "2" ? 2 : 1;
    lang = localStorage.getItem("brew.lang") || "en";
    const ca = JSON.parse(localStorage.getItem("brew.custom") || "null");
    if (ca && ROAST_LABEL[ca.roast] && PROC_LABEL[ca.process]) customAttrs = ca;
    if (mode !== "hot" && mode !== "iced") mode = "hot";
    if (!BUILDERS[methodId]) methodId = "tuned";
    if (lang !== "en" && lang !== "ko") lang = "en";

  function allBeans() { return PRESETS.concat([engineBean(customAttrs)]); }
  function bean() { return allBeans().find(b => b.id === beanId) || PRESETS[0]; }
  if (!allBeans().some(b => b.id === beanId)) beanId = "house";

  let running = false;
  let finished = false;

  // ---- Dial-in feedback: taste verdict → concrete advice ----
  function fbKey() { return `${beanId}|${methodId}|${mode}|${cups}`; }
  function fbLoad() {
    try { return JSON.parse(localStorage.getItem("brew.feedback") || "{}"); } catch (e) { return {}; }

  function fbSave(verdict) {
    try {

  }
  function fbAdvice(verdict, clicks) {
    const ko = lang === "ko";
    if (verdict === "sour") {
      return ko
        ? `다음엔 <em>${clicks - 1}클릭</em>(1 더 가늘게) 또는 물 <em>+2°C</em> — 신맛·밍밍함은 과소추출 신호입니다.`
        : `Next time try <em>${clicks - 1} clicks</em> (1 finer) or <em>+2°C</em> water — sour or weak means under-extraction.`;
    }
    if (verdict === "bitter") {
      return ko
        ? `다음엔 <em>${clicks + 1}클릭</em>(1 더 굵게) 또는 물 <em>−2°C</em> — 쓴맛·떫음은 과다추출 신호입니다.`
        : `Next time try <em>${clicks + 1} clicks</em> (1 coarser) or <em>−2°C</em> water — bitter or harsh means over-extraction.`;
    }
    return ko
      ? `잘 맞았어요 — 다음에도 <em>같은 세팅</em>으로 내리세요.`
      : `Dialed in — brew with <em>the same settings</em> next time.`;
  }
  function fbVerdictLabel(v) {
    return v === "sour" ? ui("fbSour") : v === "bitter" ? ui("fbBitter") : ui("fbGood");
  }

  function elapsedNow() {
    return baseElapsed + (running && startStamp !== null ? (Date.now() - startStamp) / 1000 : 0);
  }

  function recipe() {
    const b = bean();
    const r = BUILDERS[methodId](b, mode);
    const clicks = mode === "iced" && methodId === "tuned" ? r.clicks - 1 : r.clicks;
    const serverIce = r.ice ? (r.iceSplit ? r.ice / 2 : r.ice) : 0;
    const icePrep = serverIce
      ? (lang === "ko" ? `얼음 ${serverIce}g 서버에 먼저` : `${serverIce}g ice in server first`)
      : "";
    const prep = lang === "ko"
      ? [`커피 ${r.dose}g`, `분쇄 ${clicks}클릭`, `물 ${r.temp}°C`, icePrep].filter(Boolean).join(" · ")
      : [`${r.dose}g coffee`, `${clicks} clicks`, `${r.temp}°C`, icePrep].filter(Boolean).join(" · ");
    return {
      total: r.total,
      dose: r.dose, water: r.water, ice: r.ice, iceSplit: r.iceSplit,
      temp: r.temp, clicks, grindNote: tx(r.grindNote),
      agitation: tx(r.agitation), why: tx(r.why),
      stats: [
        { v: r.dose + "g", l: ui("statCoffee") },
        { v: String(clicks), l: ui("statClicks") },
        { v: r.temp + "°", l: ui("statWater") },
        { v: r.water + "g", l: ui("statWaterWt") },
      ],
      prep,
      phases: r.phases.map(p => ({ ...p, name: tx(p.name), hint: tx(p.hint) })),
      finish: mode === "iced"
        ? (r.iceSplit
          ? (lang === "ko" ? `완료 — 얼음 ${r.ice / 2}g 추가 후 저어주기 🧊` : `Done — add ${r.ice / 2}g ice and stir 🧊`)
          : (lang === "ko" ? "완료 — 저은 뒤 새 얼음 위에 서빙 🧊" : "Done — stir and serve over fresh ice 🧊"))
        : (lang === "ko" ? "완료 — 스월 후 서빙 ☕" : "Done — swirl and serve ☕"),
    };
  }

  const R = 124, CIRC = 2 * Math.PI * R;
  const $ = (id) => document.getElementById(id);
  const ringFill = $("ringFill");
  ringFill.style.strokeDasharray = CIRC;
  ringFill.style.strokeDashoffset = CIRC;

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function beep(freq, dur, when, gainV) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(gainV, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(when);
    o.stop(when + dur + 0.05);
  }
  function chimePhase() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(880, 0.18, t, 0.25);
    beep(1174.66, 0.28, t + 0.16, 0.25);
  }
  function tickWarn() {
    if (!audioCtx) return;
    beep(660, 0.09, audioCtx.currentTime, 0.15);
  }
  function chimeStart() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(523.25, 0.15, t, 0.22);
    beep(659.25, 0.15, t + 0.12, 0.22);
    beep(783.99, 0.25, t + 0.24, 0.25);
  }
  function chimeResume() {
    if (!audioCtx) return;
    beep(880, 0.12, audioCtx.currentTime, 0.2);
  }
  function chimeDone() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, 0.35, t + i * 0.14, 0.22));
  }

  function phaseAt(rec, sec) {
    for (let i = 0; i < rec.phases.length; i++) if (sec < rec.phases[i].to) return i;
    return rec.phases.length - 1;
  }

  function buildMethod() {
    const rec = recipe();
    const ratio = "1:" + (rec.water / rec.dose).toFixed(1).replace(/\.0$/, "");
    $("methodSummary").textContent = `· ${ratio} · ${rec.temp}° · ${fmt(rec.total)}`;

    const ko = lang === "ko";
    const ratioCell = mode === "iced" && rec.ice
      ? (ko ? `${ratio} 브루 기준 (${rec.dose}g → ${rec.water}g) · 얼음 녹으면 ≈1:${((rec.water + rec.ice) / rec.dose).toFixed(1)}`
            : `${ratio} brew (${rec.dose}g → ${rec.water}g) · ≈1:${((rec.water + rec.ice) / rec.dose).toFixed(1)} after ice melts`)
      : (ko ? `${ratio} (${rec.dose}g → 물 ${rec.water}g)` : `${ratio} (${rec.dose}g → ${rec.water}g water)`);

    const bloomPhase = rec.phases[0];
    const pourPhases = rec.phases.filter(p => p.g1 > p.g0 && p !== bloomPhase);
    const drainPhase = rec.phases.find(p => p.drain);

    const bloomCell = bloomPhase.pulse
      ? (ko ? `첫 푸어가 뜸 역할 (${bloomPhase.to}초 휴지)` : `First pour doubles as bloom (${bloomPhase.to}s rest)`)
      : (ko ? `${bloomPhase.to}초 · ${bloomPhase.g1}g (도징의 ${(bloomPhase.g1 / rec.dose).toFixed(1)}배)`
            : `${bloomPhase.to}s · ${bloomPhase.g1}g (${(bloomPhase.g1 / rec.dose).toFixed(1)}× dose)`);
    const poursCell = pourPhases
      .map(p => ko ? `${fmt(p.to)}까지 ${p.g1}g` : `${p.g1}g by ${fmt(p.to)}`).join(" · ");
    const drawdownCell = ko
      ? `${fmt(drainPhase ? drainPhase.to : rec.total)}까지 완료`
      : `Finished by ${fmt(drainPhase ? drainPhase.to : rec.total)}`;

    const rows = [
      [ui("rRatio"), ratioCell],
      [ui("rGrind"), (ko ? `${rec.clicks}클릭` : `${rec.clicks} clicks`) + rec.grindNote],
      [ui("rWater"), `${rec.temp}°C`],
      [ui("rBloom"), bloomCell],
      [ui("rPours"), poursCell],
      [ui("rAgitation"), rec.agitation],
      [ui("rDrawdown"), drawdownCell],
    ];
    if (mode === "iced" && rec.ice) {
      rows.push([ui("rIce"), rec.iceSplit
        ? (ko ? `추출 전 서버에 ${rec.ice / 2}g · 추출 후 ${rec.ice / 2}g 추가` : `${rec.ice / 2}g in server before · ${rec.ice / 2}g added after`)

    }

    $("methodRows").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  let onboarded = false;

               "라이브 타이머가 있는 푸어오버 브루잉 가이드입니다. 원두를 고르면 가장 잘 맞는 추출법을 추천하고, 소리 신호와 함께 시간별 푸어 타깃을 안내합니다 — 매번 최고의 한 잔을 위해.")}</p>

  function render() {
    const rec = recipe();
    const elapsed = elapsedNow();
    const sec = Math.min(elapsed, rec.total);
    const ko = lang === "ko";
    $("clock").textContent = fmt(Math.floor(sec));
    ringFill.style.strokeDashoffset = CIRC * (1 - sec / rec.total);

    if (finished) {
      $("phaseLabel").textContent = ui("finished");
      $("subclock").innerHTML = "&nbsp;";
      $("targetBig").innerHTML = ko ? `총 <em>${rec.water}g</em>` : `<em>${rec.water}g</em> total`;
      $("targetHint").textContent = rec.finish;
      if (!feedbackGiven) {
        $("dialin").innerHTML = `<div class="dialin-note" style="border-top:0;padding-top:2px">${ui("fbPrompt")}</div>
          <div class="dialin-row">
            <button data-fb="sour"><b>😖</b>${ui("fbSour")}</button>
            <button data-fb="good"><b>😋</b>${ui("fbGood")}</button>
            <button data-fb="bitter"><b>😣</b>${ui("fbBitter")}</button>
          </div>`;
      } else {
        const v = (fbLoad()[fbKey()] || {}).v || "good";
        $("dialin").innerHTML = `<div class="dialin-note">${fbAdvice(v, rec.clicks)}<br>${ui("fbSaved")}</div>`;
      }
      rec.phases.forEach((_, j) => { const el = $("step" + j); if (el) { el.classList.remove("active"); el.classList.add("done"); } });
      return;
    }

    const i = phaseAt(rec, sec);
    const p = rec.phases[i];
    const active = running || elapsed > 0;
    $("phaseLabel").textContent = active ? p.name : ui("ready");
    $("subclock").textContent = active
      ? (ko ? `다음까지 ${fmt(Math.ceil(p.to - sec))}` : `next in ${fmt(Math.ceil(p.to - sec))}`)
      : rec.prep;

    if (active) {
      if (p.drain) {
        $("targetBig").innerHTML = ko ? `<em>드로우다운</em> · 손 떼기` : `<em>Drawdown</em> · hands off`;
      } else {
        // Pace tracks the actual pour window, not the whole phase —
        // after the window, show "rest" instead of a crawling pace.
        const pw = p.pour || (p.pulse ? 12 : p.to - p.from);
        const poured = sec - p.from >= pw;
        if (poured && (p.pour || p.pulse)) {
          $("targetBig").innerHTML = `<em>${p.g1}g</em> ${ui("restNow")}`;
        } else if (p.pulse) {
          $("targetBig").innerHTML = ko
            ? `지금 <em>${p.g1}g</em>까지 붓고 휴지`
            : `Pour to <em>${p.g1}g</em> now, then rest`;
        } else {
          const frac = Math.min(1, (sec - p.from) / pw);
          const pace = Math.round(p.g0 + (p.g1 - p.g0) * frac);
          $("targetBig").innerHTML = ko
            ? `<em>${p.g1}g</em>까지 붓기 · 페이스 ~${pace}g`
            : `Pour to <em>${p.g1}g</em> · pace ~${pace}g`;
        }
      }
      $("targetHint").textContent = p.hint;
      $("dialin").innerHTML = "";
    } else {
      $("targetBig").innerHTML = ko
        ? `<em>${rec.phases[0].g1}g</em>까지 붓기`
        : `Pour to <em>${rec.phases[0].g1}g</em>`;
      $("targetHint").textContent = rec.prep;
      const last = fbLoad()[fbKey()];
      $("dialin").innerHTML = last
        ? `<div class="dialin-note">💡 ${ui("lastBrew")}: ${fbVerdictLabel(last.v)} — ${fbAdvice(last.v, rec.clicks)}</div>`
        : "";
    }

    rec.phases.forEach((_, j) => {
      const el = $("step" + j);
      if (!el) return;
      el.classList.toggle("active", j === i && active);
      el.classList.toggle("done", j < i);
    });
  }

  function onSecond(s) {
    const rec = recipe();
    if (s >= rec.total || s === 0) return;
    if (rec.phases.some(p => p.from === s)) chimePhase();
    else {
      const nearPhase = rec.phases.some(p => p.to !== rec.total && p.to - s <= 5 && p.to - s >= 1);
      const nearEnd = rec.total - s <= 5 && rec.total - s >= 1;
      if (nearPhase || nearEnd) tickWarn();
    }
  }

  function tick() {
    if (!running) return;
    const el = elapsedNow();
    const whole = Math.floor(el);
    if (whole !== lastWholeSecond) { lastWholeSecond = whole; onSecond(whole); }
    if (el >= recipe().total) {
      baseElapsed = recipe().total;
      startStamp = null;
      running = false;
      finished = true;
      clearInterval(timerId);
      chimeDone();
      releaseWake();
      $("btnMain").textContent = ui("start");
      document.querySelector(".app").classList.remove("brewing");
      histSave();
    }
    render();
  }

  let tessLoad = null;
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (!tessLoad) {
      tessLoad = new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        s.onload = res;
        s.onerror = () => { tessLoad = null; rej(new Error("tesseract-load")); };
        document.head.appendChild(s);
      });
    }
    return tessLoad;
  }

  async function downscale(file) {
    // Decode via <img> so EXIF orientation is always applied (phone photos
    // are often stored rotated); grayscale + contrast helps OCR.
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = url;
      });
      const max = 2000;
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext("2d");
      x.filter = "grayscale(1) contrast(1.25)";
      x.drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.9);
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  function interpretLabel(text) {
    const raw = text.toLowerCase();
    // Korean OCR often inserts spaces between syllables — match a
    // whitespace-stripped copy too.
    const compact = raw.replace(/[\s\-_.·]/g, "");
    const has = (...ws) => ws.some(w => raw.includes(w) || compact.includes(w.replace(/\s+/g, "")));
    const tags = [];

    let origin = null;
    if (has("gesha", "geisha", "게샤", "게이샤", "panama", "파나마")) { origin = "gesha"; tags.push("Gesha"); }
    else if (has("yirgacheffe", "예가체프", "이르가체페", "ethiopia", "에티오피아", "sidamo", "sidama", "시다모", "시다마", "guji", "구지")) { origin = "yirg"; tags.push("Ethiopia"); }
    else if (has("rwanda", "르완다", "burundi", "부룬디")) { origin = "rwanda"; tags.push("Rwanda"); }
    else if (has("kenya", "케냐", "nyeri", "니에리")) { origin = "kenya"; tags.push("Kenya"); }
    else if (has("sumatra", "수마트라", "mandheling", "만델링", "indonesia", "인도네시아")) { origin = "sumatra"; tags.push("Sumatra"); }
    else if (has("honduras", "온두라스", "marcala", "마르칼라")) { origin = "honduras"; tags.push("Honduras"); }
    else if (has("guatemala", "과테말라", "antigua", "안티구아", "huehuetenango", "우에우에")) { origin = "guatemala"; tags.push("Guatemala"); }
    else if (has("costa rica", "costarica", "코스타리카", "tarrazu", "타라주", "따라주")) { origin = "costarica"; tags.push("Costa Rica"); }
    else if (has("peru", "페루", "cajamarca", "카하마르카")) { origin = "peru"; tags.push("Peru"); }
    else if (has("mexico", "멕시코", "chiapas", "치아파스", "oaxaca", "오악사카")) { origin = "mexico"; tags.push("Mexico"); }
    else if (has("nicaragua", "니카라과", "jinotega", "히노테가")) { origin = "nicaragua"; tags.push("Nicaragua"); }
    else if (has("colombia", "columbia", "콜롬비아", "huila", "우일라", "supremo", "수프리모", "narino", "nariño", "나리뇨")) { origin = "colombia"; tags.push("Colombia"); }
    else if (has("brazil", "brasil", "브라질", "cerrado", "세하도", "세라도", "santos", "산토스")) { origin = "brazil"; tags.push("Brazil"); }

    const blend = has("blend", "블렌드", "블렌딩");
    if (blend) tags.push(lang === "ko" ? "블렌드" : "Blend");

    const honey = has("honey", "허니");
    const process = has("anaerobic", "무산소", "애너로빅", "혐기") ? "anaerobic"
      : has("natural", "내추럴") ? "natural"
      : has("washed", "워시드", "수세식", "fully washed") ? "washed" : null;
    if (process) tags.push(tx(PROC_LABEL[process]));
    if (honey && !process) tags.push(lang === "ko" ? "허니" : "Honey");

    const roast = has("dark", "다크", "강배전", "french roast", "프렌치") ? "dark"
      : has("medium", "미디엄", "중배전") ? "medium"
      : has("light", "라이트", "약배전") ? "light" : null;
    if (roast) tags.push(tx(ROAST_LABEL[roast]));

    let bean = null;
    if (process === "anaerobic" && (!origin || origin === "colombia")) bean = "coan";
    else if (origin) bean = origin;
    else if (honey) bean = "costarica";
    else if (blend) bean = "blend";
    else if (roast || process) {
      bean = "custom";
      customAttrs = { roast: roast || "medium", process: process || "washed" };
    }
    if (!bean) return null;

    const beanObj = allBeans().find(x => x.id === bean);
    const recc = recommendFor(beanObj, roast, process);
    return { bean, method: recc.best, alts: recc.alts, reason: tx(recc.reason), tags };
  }

  async function runScan(file) {
    try {
      switchTab("brew");
      scanNote(ui("scanLoading"));
      await loadTesseract();
      scanNote(ui("scanReading"));
      const src = await downscale(file);
      const worker = await Tesseract.createWorker(["eng", "kor"]);
      const { data } = await worker.recognize(src);
      await worker.terminate();
      const hit = interpretLabel(data.text || "");
      if (!hit) {
        beanId = "custom";
        refresh(true);
        const excerpt = (data.text || "").replace(/\s+/g, " ").trim().slice(0, 90)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        scanNote(ui("scanNoMatch") + (excerpt
          ? `<br><span style="opacity:.65">${lang === "ko" ? "읽은 내용" : "what I read"}: “${excerpt}…”</span>`
          : ""));
        return;
      }
      beanId = hit.bean;
      methodId = hit.method;
      refresh(true);
      histSave();
      const b = allBeans().find(x => x.id === hit.bean);
      const altNames = hit.alts.map(methodName).join(", ");
      scanNote(lang === "ko"
        ? `✅ <b>${ui("scanFound")}</b>: ${hit.tags.join(" · ")} → <b>${tx(b.chip)}</b><br>⭐ 추천 추출법: <b>${methodName(hit.method)}</b> — ${hit.reason}<br><span style="opacity:.7">대안: ${altNames}</span>`
        : `✅ <b>${ui("scanFound")}</b>: ${hit.tags.join(" · ")} → <b>${tx(b.chip)}</b><br>⭐ Best method: <b>${methodName(hit.method)}</b> — ${hit.reason}<br><span style="opacity:.7">Also good: ${altNames}</span>`);
    } catch (e) {
      scanNote(ui("scanFailLoad"));
    }
  }

  $("scanInput").addEventListener("change", () => {
    const f = $("scanInput").files && $("scanInput").files[0];
    $("scanInput").value = "";
    if (f) runScan(f);
  });

  if ($("buildStamp").textContent.includes("BUILD_STAMP_DEV")) $("buildStamp").hidden = true;
  $("btnHot").classList.toggle("on", mode === "hot");
  $("btnIced").classList.toggle("on", mode === "iced");
  switchTab(onboarded ? "brew" : "guide");
  buildStatics();
  render();
</script>
