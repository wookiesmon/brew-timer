<meta charset="utf-8">
<title>Drip Coffee Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='88'>☕</text></svg>">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B06A2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brew Timer">
<style>
  :root {
    --bg: #F6F2EC;
    --surface: #FFFFFF;
    --ink: #2A211A;
    --muted: #8A7A6A;
    --line: rgba(42, 33, 26, 0.12);
    --track: rgba(42, 33, 26, 0.08);
    --hot: #B06A2C;
    --iced: #2E7EA6;
    --accent: var(--hot);
    --accent-ink: #FFFFFF;
    --done: #4C8A5C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16110D;
      --surface: #211A14;
      --ink: #F2E9DF;
      --muted: #A08D7A;
      --line: rgba(242, 233, 223, 0.12);
      --track: rgba(242, 233, 223, 0.09);
      --hot: #D98E4A;
      --iced: #7FB8D6;
      --accent-ink: #16110D;
      --done: #7DB98D;
    }
  }
  :root[data-theme="light"] {
    --bg: #F6F2EC;
    --surface: #FFFFFF;
    --ink: #2A211A;
    --muted: #8A7A6A;
    --line: rgba(42, 33, 26, 0.12);
    --track: rgba(42, 33, 26, 0.08);
    --hot: #B06A2C;
    --iced: #2E7EA6;
    --accent-ink: #FFFFFF;
    --done: #4C8A5C;
  }
  :root[data-theme="dark"] {
    --bg: #16110D;
    --surface: #211A14;
    --ink: #F2E9DF;
    --muted: #A08D7A;
    --line: rgba(242, 233, 223, 0.12);
    --track: rgba(242, 233, 223, 0.09);
    --hot: #D98E4A;
    --iced: #7FB8D6;
    --accent-ink: #16110D;
    --done: #7DB98D;
  }
  :root.iced { --accent: var(--iced); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    max-width: 420px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 13px;
    min-height: 100dvh;
  }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
    flex: 1;
  }
  h1 small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px; }

  .langbtn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 700 12px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--track);
    border-radius: 999px;
    padding: 3px;
    min-width: 132px;
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 13px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.08em;
    padding: 9px 0;
    border-radius: 999px;
    cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }

  .chiprow {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    margin: 0 -18px;
    padding: 2px 18px 4px;
    scrollbar-width: none;
  }
  .chiprow::-webkit-scrollbar { display: none; }
  .chip {
    appearance: none;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font: 600 13px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chiprow.methods { margin-top: -6px; }
  .chiprow.methods .chip { font-size: 12px; padding: 8px 12px; }
  .rowlabel {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    margin: -4px 0 -8px 2px;
  }

  .beaninfo {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: -4px;
    line-height: 1.45;
  }
  .beaninfo b { color: var(--ink); font-weight: 600; }

  .custom-cfg { display: flex; flex-direction: column; gap: 8px; margin-top: -2px; }
  .custom-cfg[hidden] { display: none; }
  .cfg-row { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 10px; }
  .cfg-row > span {
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .cfg-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--track); border-radius: 999px; padding: 3px; }
  .cfg-seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--muted);
    font: 600 12px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    padding: 8px 0;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .cfg-seg button.on { background: var(--accent); color: var(--accent-ink); }

  .method {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .method-head {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 12px 14px;
    font: 600 13px/1.3 ui-rounded, -apple-system, system-ui, sans-serif;
    cursor: pointer;
    text-align: left;
  }
  .method-head .sum { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .method-head .chev { color: var(--accent); flex: 0 0 auto; transition: transform 0.2s; }
  .method.open .chev { transform: rotate(180deg); }
  .method-body { display: none; padding: 0 14px 13px; }
  .method.open .method-body { display: block; }
  .method dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 14px;
    margin: 0 0 10px;
    font-size: 13px;
  }
  .method dt {
    color: var(--muted);
    font-size: 10.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 600;
    padding-top: 2px;
  }
  .method dd { margin: 0; font-variant-numeric: tabular-nums; }
  .method .why {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 10px;
    line-height: 1.45;
  }

  .recipe {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 6px 8px;
    text-align: center;
  }
  .stat b {
    display: block;
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .ringwrap { position: relative; margin: 2px auto 0; width: min(72vw, 280px); }
  .ringwrap svg { display: block; width: 100%; height: auto; transform: rotate(-90deg); }
  .ring-track { stroke: var(--track); }
  .ring-fill {
    stroke: var(--accent);
    transition: stroke 0.3s;
    stroke-linecap: round;
  }
  .ring-tick { stroke: var(--bg); }
  .center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 2px;
    padding: 0 30px;
  }
  .phase-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .clock {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-size: 54px;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .subclock {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .target {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 13px 16px;
    text-align: center;
  }
  .target .big {
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .target .big em { font-style: normal; color: var(--accent); }
  .target .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .steps { display: flex; flex-direction: column; gap: 6px; }
  .step {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    font-size: 14px;
    opacity: 0.62;
    transition: opacity 0.25s, border-color 0.25s;
  }
  .step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
  .step .name { font-weight: 600; }
  .step .name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .step .time { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .step.active { opacity: 1; border-color: var(--accent); }
  .step.active .dot { background: var(--accent); }
  .step.done { opacity: 0.62; }
  .step.done .dot { background: var(--done); }

  .controls { display: grid; grid-template-columns: 1fr 96px; gap: 10px; margin-top: auto; }
  .btn {
    appearance: none;
    border: 0;
    border-radius: 18px;
    font: 700 17px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    letter-spacing: 0.02em;
    padding: 18px 0;
    cursor: pointer;
  }
  .btn:active { transform: scale(0.98); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 14px; }

  .onboard {
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 13px 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .onboard[hidden] { display: none; }
  .onboard ol {
    margin: 0;
    padding: 0 0 0 2px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    line-height: 1.45;
  }
  .onboard li { display: flex; gap: 9px; align-items: baseline; }
  .onboard li b {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 11.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transform: translateY(3px);
  }
  .onboard button {
    appearance: none;
    align-self: flex-end;
    border: 0;
    background: var(--track);
    color: var(--ink);
    font: 600 12.5px/1 ui-rounded, -apple-system, system-ui, sans-serif;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
  }

  .dialin-row { display: flex; gap: 7px; margin-top: 11px; }
  .dialin-row button {
    appearance: none;
    flex: 1;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 600 12px/1.3 ui-rounded, -apple-system, system-ui, sans-serif;
    padding: 10px 4px;
    border-radius: 12px;
    cursor: pointer;
  }
  .dialin-row button:active { transform: scale(0.97); }
  .dialin-row button b { display: block; font-size: 18px; margin-bottom: 3px; }
  .dialin-note {
    margin-top: 10px;
    font-size: 12.5px;
    line-height: 1.45;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 9px;
  }
  .dialin-note em { font-style: normal; color: var(--accent); font-weight: 600; }
  #dialin:empty { display: none; }

  /* Focus mode: while brewing, hide everything that isn't the brew */
  .app.brewing .rowlabel,
  .app.brewing .chiprow,
  .app.brewing .beaninfo,
  .app.brewing .custom-cfg,
  .app.brewing .method,
  .app.brewing .recipe { display: none; }
  .app.brewing .ringwrap { width: min(84vw, 320px); margin-top: 8px; }
  .app.brewing .clock { font-size: 62px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="app">
  <header>
    <h1 id="title">Brew Timer<small id="subtitle">Pour-over drip</small></h1>
    <button class="langbtn" id="btnLang">한국어</button>
    <div class="seg" role="tablist" aria-label="Brew mode">
      <button id="btnHot" class="on" role="tab" aria-selected="true">HOT</button>
      <button id="btnIced" role="tab" aria-selected="false">ICED</button>
    </div>
  </header>

  <div class="onboard" id="onboard" hidden>
    <ol id="onboardSteps"></ol>
    <button id="onboardOk"></button>
  </div>

  <div class="rowlabel" id="lblBean">Bean</div>
  <div class="chiprow" id="beans" role="tablist" aria-label="Bean"></div>
  <div class="rowlabel" id="lblMethod">Method</div>
  <div class="chiprow methods" id="methods" role="tablist" aria-label="Method"></div>
  <div class="beaninfo" id="methodinfo"></div>
  <div class="beaninfo" id="beaninfo"></div>

  <div class="custom-cfg" id="customCfg" hidden>
    <div class="cfg-row">
      <span id="lblRoast">Roast</span>
      <div class="cfg-seg" id="cfgRoast">
        <button data-v="light">Light</button>
        <button data-v="medium">Medium</button>
        <button data-v="dark">Dark</button>
      </div>
    </div>
    <div class="cfg-row">
      <span id="lblProcess">Process</span>
      <div class="cfg-seg" id="cfgProcess">
        <button data-v="washed">Washed</button>
        <button data-v="natural">Natural</button>
        <button data-v="anaerobic">Anaerobic</button>
      </div>
    </div>
  </div>

  <div class="method" id="method">
    <button class="method-head" id="methodToggle" aria-expanded="false">
      <span><span id="methodHeadLabel">Best method</span>&nbsp;<span class="sum" id="methodSummary"></span></span>
      <span class="chev">▾</span>
    </button>
    <div class="method-body">
      <dl id="methodRows"></dl>
      <p class="why" id="methodWhy"></p>
    </div>
  </div>

  <div class="recipe" id="recipe"></div>

  <div class="ringwrap">
    <svg viewBox="0 0 280 280" aria-hidden="true">
      <circle class="ring-track" cx="140" cy="140" r="124" fill="none" stroke-width="14"></circle>
      <circle class="ring-fill" id="ringFill" cx="140" cy="140" r="124" fill="none" stroke-width="14"></circle>
      <g id="ticks"></g>
    </svg>
    <div class="center">
      <div class="phase-label" id="phaseLabel">Ready</div>
      <div class="clock" id="clock">0:00</div>
      <div class="subclock" id="subclock">&nbsp;</div>
    </div>
  </div>

  <div class="target">
    <div class="big" id="targetBig"></div>
    <div class="hint" id="targetHint"></div>
    <div id="dialin"></div>
  </div>

  <div class="steps" id="steps"></div>

  <div class="controls">
    <button class="btn primary" id="btnMain">Start</button>
    <button class="btn ghost" id="btnReset">Reset</button>
  </div>
</div>

<script>
  // i18n: every translatable string is a [english, korean] pair, resolved
  // through tx() at render time. lang persists in localStorage.
  let lang = "en";

  function tx(v) { return Array.isArray(v) ? v[lang === "ko" ? 1 : 0] : v; }

  const UI = {
    subtitle: ["Pour-over drip", "푸어오버 드립"],
    lblBean: ["Bean", "원두"],
    lblMethod: ["Method", "추출법"],
    lblRoast: ["Roast", "로스팅"],
    lblProcess: ["Process", "가공"],
    bestMethod: ["Best method", "추출 레시피"],
    start: ["Start", "시작"],
    pause: ["Pause", "일시정지"],
    resume: ["Resume", "계속"],
    reset: ["Reset", "리셋"],
    ready: ["Ready", "준비"],
    finished: ["Finished", "완료"],
    nextIn: ["next in", "다음까지"],
    statCoffee: ["Coffee", "커피"],
    statClicks: ["Clicks", "클릭"],
    statWater: ["Water", "물 온도"],
    statWaterWt: ["Water wt", "총 물"],
    rRatio: ["Ratio", "비율"],
    rGrind: ["Grind", "분쇄도"],
    rWater: ["Water", "물 온도"],
    rBloom: ["Bloom", "뜸"],
    rPours: ["Pours", "푸어"],
    rAgitation: ["Agitation", "교반"],
    rDrawdown: ["Drawdown", "드로우다운"],
    rIce: ["Ice", "얼음"],
    rFilter: ["Filter", "필터"],
    filterRinse: ["Rinse with hot water, discard rinse", "뜨거운 물로 필터 린스 후 린스물 버리기"],
    cfgOpts: {
      light: ["Light", "라이트"], medium: ["Medium", "미디엄"], dark: ["Dark", "다크"],
      washed: ["Washed", "워시드"], natural: ["Natural", "내추럴"], anaerobic: ["Anaerobic", "무산소"],
    },
    fbPrompt: ["How did it taste?", "맛이 어땠나요?"],
    fbSour: ["Sour / weak", "시큼·밍밍"],
    fbGood: ["Perfect", "딱 좋아요"],
    fbBitter: ["Bitter / harsh", "쓰고 떫음"],
    fbSaved: ["Saved — I'll remind you next brew.", "저장했어요 — 다음 추출 때 알려드릴게요."],
    lastBrew: ["Last brew", "지난 추출"],
    ob1: ["Pick your <b2>bean</b2> and a <b2>method</b2> — each choice explains itself below the chips.",
          "<b2>원두</b2>와 <b2>추출법</b2>을 고르세요 — 선택하면 아래에 설명이 나옵니다."],
    ob2: ["Weigh and grind to the numbers shown, heat your water, rinse the filter.",
          "표시된 대로 원두를 계량·분쇄하고, 물을 데우고, 필터를 린스하세요."],
    ob3: ["Press <b2>Start</b2> with your first pour — chimes guide every step, so just follow the big card.",
          "첫 푸어와 함께 <b2>시작</b2>을 누르세요 — 차임벨이 단계마다 알려주니 큰 카드만 따라가면 됩니다."],
    obOk: ["Got it", "알겠어요"],
  };
  function ui(k) { return tx(UI[k]); }

  const PRESETS = [
    {
      id: "house", chip: ["House", "하우스"], name: ["House Recipe", "하우스 레시피"], roast: "medium",
      proc: ["Original method", "오리지널 방식"], notes: ["Your baseline recipe, any bean", "기본 레시피, 어떤 원두든"],
      temp: 93, clicks: 20,
      hot: { bloom: 40, p1: 70, total: 120 },
      iced: { bloom: 40, p1: 70, total: 90 },
      hintBloom: ["Pour 40g quickly, then let it bloom", "40g를 빠르게 붓고 뜸들이기"],
      hintP1: ["Steady spiral pour", "일정한 스파이럴 푸어"],
      hintP2: ["Slow, even pour to the end", "끝까지 천천히 고르게"],
      agitation: ["Swirl once after bloom", "뜸 후 한 번 스월"],
      why: ["The baseline: 93°C and a 2:00 drawdown balance sweetness and clarity for most medium roasts.",
            "기본 레시피: 93°C와 2:00 드로우다운으로 대부분의 미디엄 로스트에서 단맛과 클린함의 균형을 잡습니다."],

  function engineBean(attrs) {
    const { roast, process } = attrs;
    let temp = { light: 95, medium: 90, dark: 88 }[roast];
    if (process === "natural") temp -= 1;
    if (process === "anaerobic") temp = Math.min(temp - 3, 91);
    temp = Math.max(temp, 87);

    const clicks = { light: 19, medium: 21, dark: 22 }[roast];

    let bloom = { light: 45, medium: 35, dark: 30 }[roast];
    if (process === "natural") bloom += 5;
    if (process === "anaerobic") bloom += 8;
    bloom = Math.min(bloom, 55);

    let hotTotal = { light: 130, medium: 108, dark: 100 }[roast];
    if (process === "natural") hotTotal -= 4;
    if (process === "anaerobic") hotTotal -= 8;
    hotTotal = Math.max(hotTotal, Math.round(bloom + 50));

    let icedTotal = Math.max(Math.round(hotTotal * 0.73), bloom + 35);
    const hotP1 = Math.min(bloom + 34, hotTotal - 15);
    const icedP1 = Math.min(bloom + 28, icedTotal - 12);

    const gentle = process === "anaerobic" || process === "natural" || roast === "dark";
    const agitation = process === "anaerobic" ? ["Gentle — center pours, no swirl", "부드럽게 — 센터 푸어, 스월 없음"]
      : roast === "dark" ? ["None — pour gently", "없음 — 부드럽게 붓기"]
      : process === "natural" ? ["Light swirl after bloom", "뜸 후 가벼운 스월"]
      : ["Swirl once after bloom", "뜸 후 한 번 스월"];

    const whyRoast = {
      light: [`light roasts are dense, so ${temp}°C and a finer grind drive full extraction`,
              `라이트 로스트는 밀도가 높아 ${temp}°C와 가는 분쇄로 충분히 추출해야 합니다`],

                `${bloom}초 뜸으로 내추럴의 발효 가스를 먼저 내보냅니다`],
      anaerobic: [`an extended ${bloom}s bloom and gentle pours keep ferment funk sweet instead of sour`,

    }[process];

    return {
      id: "custom", chip: ["Custom ⚙", "커스텀 ⚙"], name: ["Custom Bean", "커스텀 원두"], roast,
      proc: [`${ROAST_LABEL[roast][0]} roast · ${PROC_LABEL[process][0]}`,
             `${ROAST_LABEL[roast][1]} 로스팅 · ${PROC_LABEL[process][1]}`],
      notes: ["Method derived from roast + process", "로스팅+가공 기반 자동 생성"],
      temp, clicks,
      hot: { bloom, p1: hotP1, total: hotTotal },
      iced: { bloom, p1: icedP1, total: icedTotal },

  function tunedDose(b, m) {
    if (b.id === "house") {
      return m === "hot" ? { dose: 15, water: 260, ice: 0 } : { dose: 17, water: 200, ice: 120, iceSplit: true };
    }
    const hot = { light: { dose: 15, water: 250 }, medium: { dose: 16, water: 240 }, dark: { dose: 15, water: 225 } }[b.roast];
    if (m === "hot") return { dose: hot.dose, water: hot.water, ice: 0 };
    return { dose: hot.dose + 2, water: Math.round(hot.water * 0.77 / 5) * 5, ice: 120, iceSplit: true };

    if (verdict === "bitter") {
      return ko
        ? `다음엔 <em>${clicks + 1}클릭</em>(1 더 굵게) 또는 물 <em>−2°C</em> — 쓴맛·떫음은 과다추출 신호입니다.`
        : `Next time try <em>${clicks + 1} clicks</em> (1 coarser) or <em>−2°C</em> water — bitter or harsh means over-extraction.`;
    }
    return ko
      ? `잘 맞았어요 — 다음에도 <em>같은 세팅</em>으로 내리세요.`
      : `Dialed in — brew with <em>the same settings</em> next time.`;
  }
  function fbVerdictLabel(v) {
    return v === "sour" ? ui("fbSour") : v === "bitter" ? ui("fbBitter") : ui("fbGood");
  }

  function elapsedNow() {
    return baseElapsed + (running && startStamp !== null ? (Date.now() - startStamp) / 1000 : 0);
  }

  function recipe() {
    const b = bean();
    const r = BUILDERS[methodId](b, mode);
    const clicks = mode === "iced" && methodId === "tuned" ? r.clicks - 1 : r.clicks;
    const serverIce = r.ice ? (r.iceSplit ? r.ice / 2 : r.ice) : 0;
    const icePrep = serverIce
      ? (lang === "ko" ? `얼음 ${serverIce}g 서버에 먼저` : `${serverIce}g ice in server first`)
      : "";
    const prep = lang === "ko"
      ? [`커피 ${r.dose}g`, `분쇄 ${clicks}클릭`, `물 ${r.temp}°C`, icePrep].filter(Boolean).join(" · ")
      : [`${r.dose}g coffee`, `${clicks} clicks`, `${r.temp}°C`, icePrep].filter(Boolean).join(" · ");
    return {
      total: r.total,
      dose: r.dose, water: r.water, ice: r.ice, iceSplit: r.iceSplit,
      temp: r.temp, clicks, grindNote: tx(r.grindNote),
      agitation: tx(r.agitation), why: tx(r.why),
      stats: [
        { v: r.dose + "g", l: ui("statCoffee") },
        { v: String(clicks), l: ui("statClicks") },
        { v: r.temp + "°", l: ui("statWater") },
        { v: r.water + "g", l: ui("statWaterWt") },
      ],
      prep,
      phases: r.phases.map(p => ({ ...p, name: tx(p.name), hint: tx(p.hint) })),
      finish: mode === "iced"
        ? (r.iceSplit
          ? (lang === "ko" ? `완료 — 얼음 ${r.ice / 2}g 추가 후 저어주기 🧊` : `Done — add ${r.ice / 2}g ice and stir 🧊`)
          : (lang === "ko" ? "완료 — 저은 뒤 새 얼음 위에 서빙 🧊" : "Done — stir and serve over fresh ice 🧊"))
        : (lang === "ko" ? "완료 — 스월 후 서빙 ☕" : "Done — swirl and serve ☕"),
    };
  }

  const R = 124, CIRC = 2 * Math.PI * R;
  const $ = (id) => document.getElementById(id);
  const ringFill = $("ringFill");
  ringFill.style.strokeDasharray = CIRC;
  ringFill.style.strokeDashoffset = CIRC;

  function fmt(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function beep(freq, dur, when, gainV) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(gainV, when + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(when);
    o.stop(when + dur + 0.05);
  }
  function chimePhase() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(880, 0.18, t, 0.25);
    beep(1174.66, 0.28, t + 0.16, 0.25);
  }
  function tickWarn() {
    if (!audioCtx) return;
    beep(660, 0.09, audioCtx.currentTime, 0.15);
  }
  function chimeStart() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    beep(523.25, 0.15, t, 0.22);
    beep(659.25, 0.15, t + 0.12, 0.22);
    beep(783.99, 0.25, t + 0.24, 0.25);
  }
  function chimeResume() {
    if (!audioCtx) return;
    beep(880, 0.12, audioCtx.currentTime, 0.2);
  }
  function chimeDone() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => beep(f, 0.35, t + i * 0.14, 0.22));
  }

  function phaseAt(rec, sec) {
    for (let i = 0; i < rec.phases.length; i++) if (sec < rec.phases[i].to) return i;
    return rec.phases.length - 1;
  }

  function buildMethod() {
    const rec = recipe();
    const ratio = "1:" + (rec.water / rec.dose).toFixed(1).replace(/\.0$/, "");
    $("methodSummary").textContent = `· ${ratio} · ${rec.temp}° · ${fmt(rec.total)}`;

    const ko = lang === "ko";
    const ratioCell = mode === "iced" && rec.ice
      ? (ko ? `${ratio} 브루 기준 (${rec.dose}g → ${rec.water}g) · 얼음 녹으면 ≈1:${((rec.water + rec.ice) / rec.dose).toFixed(1)}`
            : `${ratio} brew (${rec.dose}g → ${rec.water}g) · ≈1:${((rec.water + rec.ice) / rec.dose).toFixed(1)} after ice melts`)
      : (ko ? `${ratio} (${rec.dose}g → 물 ${rec.water}g)` : `${ratio} (${rec.dose}g → ${rec.water}g water)`);

    const bloomPhase = rec.phases[0];
    const pourPhases = rec.phases.filter(p => p.g1 > p.g0 && p !== bloomPhase);
    const drainPhase = rec.phases.find(p => p.drain);

    const bloomCell = bloomPhase.pulse
      ? (ko ? `첫 푸어가 뜸 역할 (${bloomPhase.to}초 휴지)` : `First pour doubles as bloom (${bloomPhase.to}s rest)`)
      : (ko ? `${bloomPhase.to}초 · ${bloomPhase.g1}g (도징의 ${(bloomPhase.g1 / rec.dose).toFixed(1)}배)`
            : `${bloomPhase.to}s · ${bloomPhase.g1}g (${(bloomPhase.g1 / rec.dose).toFixed(1)}× dose)`);
    const poursCell = pourPhases
      .map(p => ko ? `${fmt(p.to)}까지 ${p.g1}g` : `${p.g1}g by ${fmt(p.to)}`).join(" · ");
    const drawdownCell = ko
      ? `${fmt(drainPhase ? drainPhase.to : rec.total)}까지 완료`
      : `Finished by ${fmt(drainPhase ? drainPhase.to : rec.total)}`;

    const rows = [
      [ui("rRatio"), ratioCell],
      [ui("rGrind"), (ko ? `${rec.clicks}클릭` : `${rec.clicks} clicks`) + rec.grindNote],
      [ui("rWater"), `${rec.temp}°C`],
      [ui("rBloom"), bloomCell],
      [ui("rPours"), poursCell],
      [ui("rAgitation"), rec.agitation],
      [ui("rDrawdown"), drawdownCell],
    ];
    if (mode === "iced" && rec.ice) {
      rows.push([ui("rIce"), rec.iceSplit
        ? (ko ? `추출 전 서버에 ${rec.ice / 2}g · 추출 후 ${rec.ice / 2}g 추가` : `${rec.ice / 2}g in server before · ${rec.ice / 2}g added after`)
        : (ko ? `추출 전 서버에 ${rec.ice}g` : `${rec.ice}g in server before brewing`)]);
    }
    rows.push([ui("rFilter"), ui("filterRinse")]);

    $("methodRows").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    $("methodWhy").textContent = rec.why;
  }

  let onboarded = false;
  try { onboarded = localStorage.getItem("brew.onboarded") === "1"; } catch (e) {}
  function dismissOnboard() {
    onboarded = true;
    try { localStorage.setItem("brew.onboarded", "1"); } catch (e) {}
    $("onboard").hidden = true;
  }

  function applyChrome() {
    $("onboard").hidden = onboarded;
    $("onboardSteps").innerHTML = [ui("ob1"), ui("ob2"), ui("ob3")]
      .map((s, i) => `<li><b>${i + 1}</b><span>${s.replace(/<b2>/g, "<strong>").replace(/<\/b2>/g, "</strong>")}</span></li>`).join("");
    $("onboardOk").textContent = ui("obOk");
    $("subtitle").textContent = ui("subtitle");
    $("btnLang").textContent = lang === "ko" ? "English" : "한국어";
    $("lblBean").textContent = ui("lblBean");
    $("lblMethod").textContent = ui("lblMethod");
    $("lblRoast").textContent = ui("lblRoast");
    $("lblProcess").textContent = ui("lblProcess");
    $("methodHeadLabel").textContent = ui("bestMethod");
    $("btnReset").textContent = ui("reset");
    $("btnMain").textContent = running ? ui("pause") : (baseElapsed > 0 && !finished ? ui("resume") : ui("start"));
    document.querySelectorAll(".cfg-seg button").forEach(el => {
      el.textContent = tx(UI.cfgOpts[el.dataset.v]);
    });
    document.documentElement.lang = lang;
  }

  function buildStatics() {
    const rec = recipe();
    const b = bean();
    document.documentElement.classList.toggle("iced", mode === "iced");

    $("beans").innerHTML = allBeans()
      .map(x => `<button class="chip${x.id === beanId ? " on" : ""}" data-bean="${x.id}" role="tab" aria-selected="${x.id === beanId}">${tx(x.chip)}</button>`).join("");
    $("methods").innerHTML = METHODS
      .map(x => `<button class="chip${x.id === methodId ? " on" : ""}" data-method="${x.id}" role="tab" aria-selected="${x.id === methodId}">${tx(x.chip)}</button>`).join("");
    $("beaninfo").innerHTML = `<b>${tx(b.name)}</b> · ${tx(b.proc)} — ${tx(b.notes)}`;
    const mi = METHODS.find(x => x.id === methodId);
    $("methodinfo").innerHTML = `<b>${tx(mi.chip)}</b> · ${tx(mi.who)}.<br>${tx(mi.pick)}.`;

    $("customCfg").hidden = beanId !== "custom";
    if (beanId === "custom") {
      document.querySelectorAll("#cfgRoast button").forEach(el =>
        el.classList.toggle("on", el.dataset.v === customAttrs.roast));
      document.querySelectorAll("#cfgProcess button").forEach(el =>
        el.classList.toggle("on", el.dataset.v === customAttrs.process));
    }

    buildMethod();

    $("recipe").innerHTML = rec.stats
      .map(s => `<div class="stat"><b>${s.v}</b><span>${s.l}</span></div>`).join("");
    $("steps").innerHTML = rec.phases
      .map((p, i) => `<div class="step" id="step${i}">
        <div class="dot"></div>
        <div class="name">${p.name}${p.g1 > p.g0 ? ` · ${p.g0}g → ${p.g1}g` : ""}<small>${p.hint}</small></div>
        <div class="time">${fmt(p.from)}–${fmt(p.to)}</div>
      </div>`).join("");
    $("ticks").innerHTML = rec.phases.slice(1).map(p => {
      const a = (p.from / rec.total) * 2 * Math.PI - Math.PI / 2;
      const x1 = 140 + Math.cos(a) * (R - 9), y1 = 140 + Math.sin(a) * (R - 9);
      const x2 = 140 + Math.cos(a) * (R + 9), y2 = 140 + Math.sin(a) * (R + 9);
      return `<line class="ring-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="4" transform="rotate(90 140 140)"></line>`;
    }).join("");

    document.querySelectorAll("#beans .chip").forEach(el =>
      el.addEventListener("click", () => setBean(el.dataset.bean)));
    document.querySelectorAll("#methods .chip").forEach(el =>
      el.addEventListener("click", () => setMethod(el.dataset.method)));

    applyChrome();
  }

  function render() {
    const rec = recipe();
    const elapsed = elapsedNow();
    const sec = Math.min(elapsed, rec.total);
    const ko = lang === "ko";
    $("clock").textContent = fmt(Math.floor(sec));
    ringFill.style.strokeDashoffset = CIRC * (1 - sec / rec.total);

    if (finished) {
      $("phaseLabel").textContent = ui("finished");
      $("subclock").innerHTML = "&nbsp;";
      $("targetBig").innerHTML = ko ? `총 <em>${rec.water}g</em>` : `<em>${rec.water}g</em> total`;
      $("targetHint").textContent = rec.finish;
      if (!feedbackGiven) {
        $("dialin").innerHTML = `<div class="dialin-note" style="border-top:0;padding-top:2px">${ui("fbPrompt")}</div>
          <div class="dialin-row">
            <button data-fb="sour"><b>😖</b>${ui("fbSour")}</button>
            <button data-fb="good"><b>😋</b>${ui("fbGood")}</button>
            <button data-fb="bitter"><b>😣</b>${ui("fbBitter")}</button>
          </div>`;
      } else {
        const v = (fbLoad()[fbKey()] || {}).v || "good";
        $("dialin").innerHTML = `<div class="dialin-note">${fbAdvice(v, rec.clicks)}<br>${ui("fbSaved")}</div>`;
      }
      rec.phases.forEach((_, j) => { const el = $("step" + j); if (el) { el.classList.remove("active"); el.classList.add("done"); } });
      return;
    }

    const i = phaseAt(rec, sec);
    const p = rec.phases[i];
    const active = running || elapsed > 0;
    $("phaseLabel").textContent = active ? p.name : ui("ready");
    $("subclock").textContent = active
      ? (ko ? `다음까지 ${fmt(Math.ceil(p.to - sec))}` : `next in ${fmt(Math.ceil(p.to - sec))}`)
      : rec.prep;

    if (active) {
      if (p.drain) {
        $("targetBig").innerHTML = ko ? `<em>드로우다운</em> · 손 떼기` : `<em>Drawdown</em> · hands off`;
      } else if (p.pulse) {
        $("targetBig").innerHTML = ko
          ? `지금 <em>${p.g1}g</em>까지 붓고 휴지`
          : `Pour to <em>${p.g1}g</em> now, then rest`;
      } else {
        const frac = Math.min(1, (sec - p.from) / (p.to - p.from));
        const pace = Math.round(p.g0 + (p.g1 - p.g0) * frac);
        $("targetBig").innerHTML = ko
          ? `<em>${p.g1}g</em>까지 붓기 · 페이스 ~${pace}g`
          : `Pour to <em>${p.g1}g</em> · pace ~${pace}g`;
      }
      $("targetHint").textContent = p.hint;
      $("dialin").innerHTML = "";
    } else {
      $("targetBig").innerHTML = ko
        ? `<em>${rec.phases[0].g1}g</em>까지 붓기`
        : `Pour to <em>${rec.phases[0].g1}g</em>`;
      $("targetHint").textContent = rec.prep;
      const last = fbLoad()[fbKey()];
      $("dialin").innerHTML = last
        ? `<div class="dialin-note">💡 ${ui("lastBrew")}: ${fbVerdictLabel(last.v)} — ${fbAdvice(last.v, rec.clicks)}</div>`
        : "";
    }

    rec.phases.forEach((_, j) => {
      const el = $("step" + j);
      if (!el) return;
      el.classList.toggle("active", j === i && active);
      el.classList.toggle("done", j < i);
    });
  }

  function onSecond(s) {
    const rec = recipe();
    if (s >= rec.total || s === 0) return;
    if (rec.phases.some(p => p.from === s)) chimePhase();
    else {
      const nearPhase = rec.phases.some(p => p.to !== rec.total && p.to - s <= 5 && p.to - s >= 1);
      const nearEnd = rec.total - s <= 5 && rec.total - s >= 1;
      if (nearPhase || nearEnd) tickWarn();
    }
  }

  function tick() {
    if (!running) return;
    const el = elapsedNow();
    const whole = Math.floor(el);
    if (whole !== lastWholeSecond) { lastWholeSecond = whole; onSecond(whole); }
    if (el >= recipe().total) {
      baseElapsed = recipe().total;
      startStamp = null;
      running = false;
      finished = true;
      clearInterval(timerId);
      chimeDone();
      releaseWake();
      $("btnMain").textContent = ui("start");
      document.querySelector(".app").classList.remove("brewing");
    }
    render();
  }

  async function grabWake() {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  }
  function releaseWake() {
    try { wakeLock?.release(); } catch (e) {}
    wakeLock = null;
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && running) grabWake();
  });

  $("btnMain").addEventListener("click", () => {
    if (finished) { reset(); }
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    audioCtx?.resume();
    const frozen = elapsedNow();
    running = !running;
    $("btnMain").textContent = running ? ui("pause") : ui("resume");
    if (running) {
      if (baseElapsed === 0) chimeStart(); else chimeResume();
      startStamp = Date.now();
      grabWake();
      timerId = setInterval(tick, 100);
      setMethodOpen(false);
      dismissOnboard();
      document.querySelector(".app").classList.add("brewing");
      window.scrollTo({ top: 0 });
    } else {
      baseElapsed = Math.min(frozen, recipe().total);
      startStamp = null;
      clearInterval(timerId);
      releaseWake();
    }
    render();
  });

  function reset() {
    running = false;
    finished = false;
    feedbackGiven = false;
    baseElapsed = 0;
    startStamp = null;
    lastWholeSecond = -1;
    clearInterval(timerId);
    releaseWake();
    $("btnMain").textContent = ui("start");
    document.querySelector(".app").classList.remove("brewing");
    render();
  }
  $("btnReset").addEventListener("click", reset);

  function setMethodOpen(open) {
    methodOpen = open;
    $("method").classList.toggle("open", open);
    $("methodToggle").setAttribute("aria-expanded", String(open));
  }
  $("methodToggle").addEventListener("click", () => setMethodOpen(!methodOpen));

  $("onboardOk").addEventListener("click", dismissOnboard);

  $("dialin").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-fb]");
    if (!btn || !finished) return;
    fbSave(btn.dataset.fb);
    feedbackGiven = true;
    render();
  });

  function persist() {
    try {
      localStorage.setItem("brew.mode", mode);
      localStorage.setItem("brew.bean", beanId);
      localStorage.setItem("brew.method", methodId);
      localStorage.setItem("brew.lang", lang);
      localStorage.setItem("brew.custom", JSON.stringify(customAttrs));
    } catch (e) {}
  }

  function refresh(openPanel) {
    persist();
    buildStatics();
    reset();
    if (openPanel) setMethodOpen(true);
  }

  function setMode(m) {
    if (mode === m) return;
    mode = m;
    $("btnHot").classList.toggle("on", m === "hot");
    $("btnIced").classList.toggle("on", m === "iced");
    $("btnHot").setAttribute("aria-selected", m === "hot");
    $("btnIced").setAttribute("aria-selected", m === "iced");
    refresh(false);
  }
  function setBean(id) {
    if (beanId === id) {
      if (id === "custom") setMethodOpen(true);
      return;
    }
    beanId = id;
    refresh(true);
  }
  function setMethod(id) {
    if (methodId === id) return;
    methodId = id;
    refresh(true);
  }
  $("btnHot").addEventListener("click", () => setMode("hot"));
  $("btnIced").addEventListener("click", () => setMode("iced"));

  $("btnLang").addEventListener("click", () => {
    lang = lang === "ko" ? "en" : "ko";
    persist();
    // Language switch must not reset a running brew — rebuild text only.
    buildStatics();
    render();
  });

  document.querySelectorAll("#cfgRoast button").forEach(el =>
    el.addEventListener("click", () => { customAttrs.roast = el.dataset.v; refresh(true); }));
  document.querySelectorAll("#cfgProcess button").forEach(el =>
    el.addEventListener("click", () => { customAttrs.process = el.dataset.v; refresh(true); }));

  $("btnHot").classList.toggle("on", mode === "hot");
  $("btnIced").classList.toggle("on", mode === "iced");
  buildStatics();
  render();
</script>
