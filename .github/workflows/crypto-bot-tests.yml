name: Crypto bot tests
on:
  pull_request:
    paths:
      - "multi_exchange_crypto_bot/**"
      - ".github/workflows/crypto-bot-tests.yml"
  push:
    branches: [main]
    paths:
      - "multi_exchange_crypto_bot/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: multi_exchange_crypto_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: multi_exchange_crypto_bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
